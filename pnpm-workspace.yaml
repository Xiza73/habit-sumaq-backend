# This is a single-package repo, but the file still has to declare `packages`.
# pnpm 9 treats the mere PRESENCE of pnpm-workspace.yaml as "this is a
# workspace" and hard-fails the install with:
#
#   ERROR  packages field missing or empty
#
# pnpm 10+ tolerates the omission, which is exactly how this shipped broken:
# local and CI run pnpm 11, Railway's Nixpacks runs pnpm 9, so the failure was
# invisible everywhere we looked. `- '.'` declares the repo root as the only
# package, which is what it already was.
packages:
  - '.'

# Written by `pnpm approve-builds`. pnpm 10+ refuses to install at all when a
# dependency wants to run a build script that has not been approved here, so
# these three have to stay listed for a clean checkout to work.
allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  unrs-resolver: true
